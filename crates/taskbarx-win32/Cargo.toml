[package]
name = "taskbarx-win32"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Conservative, session-scoped Windows 10 taskbar backend"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
