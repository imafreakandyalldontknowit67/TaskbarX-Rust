[package]
name = "taskbarx-configurator"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Windows configurator for TaskbarX's CLI protocol"


[dependencies]
taskbarx-core = { path = "../taskbarx-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
