[package]
name = "taskbarx-config"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Validated JSON settings and atomic persistence for TaskbarX-Rust"

[dependencies]
taskbarx-core = { path = "../taskbarx-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security_Cryptography"] }
