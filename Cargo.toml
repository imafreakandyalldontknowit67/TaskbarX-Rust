[workspace]
resolver = "2"
members = [
    ".",
    "crates/taskbarx-core",
    "crates/taskbarx-win32",
    "crates/taskbarx-config",
    "crates/taskbarx-configurator",
    "crates/taskbarx-shell",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = "0.61"

[package]
name = "taskbarx-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Foreground, reversible TaskbarX runtime for classic Windows taskbars"

[[bin]]
name = "taskbarx"
path = "src/main.rs"

[dependencies]
taskbarx-core = { path = "crates/taskbarx-core" }
taskbarx-win32 = { path = "crates/taskbarx-win32" }
taskbarx-config = { path = "crates/taskbarx-config" }
taskbarx-shell = { path = "crates/taskbarx-shell" }
clap.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

# Unwinding is intentional: the runtime and Session restoration guards must run.
[profile.release]
panic = "unwind"
